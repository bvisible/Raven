name: build-frontend

on:
  push:
    branches: [version-15]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build-frontend.yml'
      - '!**/node_modules/**'
      - '!raven/public/raven/**'
      - '!raven/www/raven.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install (workspace)
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          # Force rebuild on CI even when pre-built artifacts are checked in.
          # The guard in package.json ("skip-build when assets present") exists
          # to protect 4 GB Neoffice instances from OOM during `bench build`,
          # but in GitHub Actions we always want fresh artifacts that match
          # the latest frontend sources.
          FORCE_REBUILD: '1'
        run: yarn build

      # Raven writes vite output to public/raven/, not public/frontend/.
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raven/public/raven raven/www/raven.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          git push
