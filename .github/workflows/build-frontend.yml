name: build-frontend

on:
  # //// Neoffice — by hand too: a build that failed for a reason unrelated to its source
  # //// (a lost push race, see below) could only be relaunched by pushing again.
  workflow_dispatch:
  push:
    branches: [version-15]
    paths:
      # v3 moved the SPA from frontend/ to apps/web, with shared code in packages/ (01.10.2026).
      - 'apps/web/**'
      - 'packages/**'
      - 'frontend/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/build-frontend.yml'
      - '!**/node_modules/**'
      - '!raven/public/raven/**'
      - '!raven/www/raven.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          # v3's toolchain (@rolldown/plugin-babel) wants Node >= 22.12 or 24, as upstream's CI
          # runs it: on 20 the build stopped at install (01.10.2026).
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install (workspace)
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          # Force rebuild on CI even when pre-built artifacts are checked in.
          # The guard in package.json ("skip-build when assets present") exists
          # to protect 4 GB Neoffice instances from OOM during `bench build`,
          # but in GitHub Actions we always want fresh artifacts that match
          # the latest frontend sources.
          FORCE_REBUILD: '1'
        run: yarn build

      # Raven writes vite output to public/raven/, not public/frontend/.
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raven/public/raven raven/www/raven.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          # //// Neoffice — rebase and retry. A plain push loses the build whenever another commit
          # //// (the marker bot's, a cockpit pin bump) lands on the branch while this job compiles:
          # //// the push is refused as non-fast-forward and nothing rebuilds that source, so the
          # //// fleet keeps a frontend older than its code (suite, 04.09 to 13.09). A newer frontend
          # //// push cancels this run (concurrency), so whatever landed meanwhile did not touch it.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1
