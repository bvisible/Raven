  <!-- viewport-fit=cover: required for env(safe-area-inset-*) to report real values on iOS
       (composer, sidebars, drawers all pad by it) — without it they resolve to 0.
       interactive-widget=resizes-content (Android Chrome 108+ only; iOS ignores it):
       make the on-screen keyboard SHRINK the layout viewport instead of overlaying it —
       h-dvh then tracks the keyboard and the composer stays fully above it. With the
       default (resizes-visual), Chrome only scrolls the caret into view, so a growing
       multi-line composer slid its bottom edge (send button) under the keyboard. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- //// Neoffice - Frappe Shell Native (1c1c81edc, 2026-05-11 "feat(frappe-shell): integrate native Frappe sidebar+navbar in /raven").
       //// This template is the SOURCE of raven/www/raven.html (copied post-build by yarn
       //// copy-html-entry) - edit here, never there. It loads desk.bundle.css + neoffice-theme.css so
       //// the embedded Frappe sidebar/navbar have their styles, WITHOUT loading desk.bundle.js (its
       //// boot sequence fights ours). The .collapse override below undoes Tailwind's
       //// `visibility: collapse`, which hides Bootstrap 4's .navbar-collapse that Frappe still uses. -->

  <!-- Frappe Shell Native: desk CSS + neoffice_theme CSS for embedded sidebar/navbar.
       We do NOT load desk.bundle.js (timing + dependency hell with billing/nora). -->
  {% if desk_css_url %}<link rel="stylesheet" href="{{ desk_css_url }}" />{% endif %}
  <link rel="stylesheet" href="{{ neoffice_theme_css_url }}" />


  <style>
    /* === Tailwind .collapse override ===
       Tailwind ships `.collapse { visibility: collapse }` which clashes with
       Bootstrap 4 .navbar-collapse and .collapse-sidebar-link used by Frappe.
       Re-affirm visibility for the navbar and the sidebar subtree. */
    header.navbar .navbar-collapse,
    header.navbar .navbar-collapse * { visibility: visible !important; }
    header.navbar .navbar-collapse { display: flex; }
    .body-sidebar .collapse-sidebar-link,
    .body-sidebar [class*="collapse"],
    .body-sidebar-container [class*="collapse"]:not(.app-switcher-menu) {
      visibility: visible !important;
    }

    /* === FrappeSidebar hover-expand (mirrors neoffice-theme.js) === */
    .body-sidebar-container:not(.expanded) .body-sidebar {
      position: absolute;
      z-index: 1031;
    }
    .body-sidebar-container:not(.expanded) .body-sidebar-placeholder {
      display: flex;
      width: 50px;
    }
    .body-sidebar-container:not(.expanded) .body-sidebar {
      transition: width 0.18s ease-out, box-shadow 0.18s ease-out;
    }
    .body-sidebar-container:not(.expanded) .body-sidebar .sidebar-item-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }

    .body-sidebar-container.hover-expanded .body-sidebar {
      width: var(--left-sidebar-width, 220px);
      box-shadow: var(--shadow-lg);
    }
    .body-sidebar-container.hover-expanded .body-sidebar .sidebar-item-label {
      display: flex;
      align-items: center;
      opacity: 1;
    }
    .body-sidebar-container.hover-expanded .body-sidebar .standard-sidebar-label { display: block; }
    .body-sidebar-container.hover-expanded .body-sidebar .modules-section { display: flex; }
    .body-sidebar-container.hover-expanded .body-sidebar .body-sidebar-top { width: 100%; }
    .body-sidebar-container.hover-expanded .body-sidebar .sidebar-item-container { width: 100%; }
    .body-sidebar-container.hover-expanded .body-sidebar .sidebar-item-control { display: block; }
    .body-sidebar-container.hover-expanded .body-sidebar .sidebar-items { padding: 0px; width: 100%; }
    .body-sidebar-container.hover-expanded .body-sidebar .collapse-sidebar-link { visibility: visible; }
    .body-sidebar-container.hover-expanded .body-sidebar .body-sidebar-bottom { width: 100%; }
    .body-sidebar-container.hover-expanded .body-sidebar .app-switcher-dropdown {
      width: 100%;
      left: 0px;
      padding: 3px;
    }
    .body-sidebar-container.hover-expanded .body-sidebar .app-title { display: block !important; }

    .body-sidebar-container.hover-expanded .body-sidebar .sidebar-item-label,
    .body-sidebar-container.hover-expanded .body-sidebar .standard-sidebar-label,
    .body-sidebar-container.hover-expanded .body-sidebar .modules-section,
    .body-sidebar-container.hover-expanded .body-sidebar .app-title-subtitle {
      animation: sidebar-content-appear 260ms ease-out 80ms both;
    }
    @keyframes sidebar-content-appear {
      from { opacity: 0; transform: translateX(-4px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* App switcher dropdown — show/hide via React state class */
    .app-switcher-menu.hidden { display: none; }
    .app-switcher-menu.show {
      display: block;
      position: absolute;
      background: var(--fg-color, #fff);
      border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 6px;
      box-shadow: var(--shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 10%));
      z-index: 1040;
      min-width: 200px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 4px;
      left: 8px;
      top: 56px;
    }

    /* === Frappe-pattern layout : sidebar and main as flex siblings === */
    .main-section { background: var(--fg-color, white); }
    .main-section > .navbar-wrapper,
    header.navbar {
      position: relative;
      background: var(--navbar-bg, var(--fg-color, white));
    }

    /* Concave corner pseudo-element — bottom-left of navbar visually rounds
       into the top-right of the sidebar. */
    header.navbar::before {
      content: "";
      position: absolute;
      bottom: -16px;
      left: 0;
      width: 16px;
      height: 16px;
      background: radial-gradient(
        circle at bottom right,
        transparent 16px,
        var(--navbar-bg, var(--fg-color, white)) 16px
      );
      pointer-events: none;
      z-index: 1;
    }

    .body-sidebar { background: var(--fg-color, white); }

    /* Raven-specific tweaks vs Mint/Neoconstruction: the Raven SPA needs the
       full viewport (chat messaging UX), so `.page-content` has NO padding
       and the inner Raven layout owns the scroll. */
    body { background: var(--bg-color, oklch(0.965 0.005 80)) !important; display: block !important; }
    main.main-section { background: transparent !important; }
    .page-content {
      padding: 0 !important;
      /* main.main-section is overflowY:auto with h:100vh; .page-content
         takes the remaining height after the navbar so Raven's chat fills
         the viewport. */
      min-height: calc(100vh - 50px);
      display: flex;
      flex-direction: column;
    }
    .frappe-desk-root { background: var(--bg-color, oklch(0.965 0.005 80)); }

    #root { width: 100%; min-height: 100vh; }
  </style>

  <!-- //// Neoffice - Frappe Shell Native (1c1c81edc, 2026-05-11 "feat(frappe-shell): integrate native Frappe sidebar+navbar in /raven"): host node for the three
       //// inlined Frappe icon sprites, so <use href="#es-line-..."> resolves without desk.bundle.js. -->
  <div id="all-symbols" style="display: none; position: absolute; width: 0; height: 0;"></div>
  <div id="root"></div>
  <script>window.csrf_token = '{{ csrf_token }}';
    if (!window.frappe) window.frappe = {};

    window.app_name = "{{ app_name }}";

    frappe.boot = JSON.parse({{ boot }});
    <!-- //// Neoffice - the v2 i18n shim that used to sit here is GONE at the v3 merge:
         //// upstream's apps/web/src/main.tsx now assigns frappe._messages from the boot payload
         //// itself, and @lib/translate reads it. Our get_navbar_boot() still bakes the catalogue
         //// into that boot key, so the embedded chrome keeps rendering in the user's language.
         //// KEEP THE WARNING: inside a Jinja template, never spell a dot followed by two
         //// underscores - frappe/utils/jinja.py safe_render refuses the whole template as an
         //// anti-SSTI guard and answers HTTP 417, killing the page. That exact mistake made
         //// /raven return 417 for every visitor from 2026-09-03 to 2026-09-04. Bracket notation only. -->

    // Integration flag — MUST be set BEFORE the bundle loads because App.tsx
    // evaluates the layout swap at module load time. Bracket notation (not
    // dot) is required: Frappe's safe_render Jinja check refuses any
    // dot+double-underscore substring as a SSTI guard.
    window['__FRAPPE_INTEGRATION__'] = true;
    window['__FRAPPE_BASENAME__'] = '/raven';

    // Fetch Frappe icon sprites and inline them into #all-symbols so that
    // FrappeNavbar/FrappeSidebar React components can reference them via
    // <use href="#...">. Best-effort: missing sprites are silently skipped.
    (function loadIcons() {
      var sprites = [
        '/assets/frappe/icons/timeless/icons.svg',
        '/assets/frappe/icons/espresso/icons.svg',
        '/assets/neoffice_theme/icons/lucide/sprite.svg',
      ];
      sprites.forEach(function (url) {
        fetch(url)
          .then(function (r) { return r.text(); })
          .then(function (svgText) {
            var div = document.createElement('div');
            div.innerHTML = svgText;
            var container = document.getElementById('all-symbols');
            if (container) container.appendChild(div);
          })
          .catch(function () {});
      });
    })();
  </script>
</body>
