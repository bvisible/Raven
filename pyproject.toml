[project]
name = "raven"
authors = [
    { name = "Frappe", email = "support@frappe.io"}
]
description = "Simple, open source messaging tool"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
 "linkpreview~=0.9.0",
 "openai>=2.30.0",
 "blurhash-python",
 "openai-agents>=0.17.2",
 # //// Neoffice - markitdown pinned (d8ddbafec + 04eb1abec, 2025-11-10 "Pin markitdown to 0.0.2 to
 # //// avoid TensorFlow dependency"). markitdown 0.1.0 pulls in magika, which pulls TensorFlow and
 # //// its protobuf; that conflicts with the protobuf of google-cloud-documentai just above and the
 # //// install breaks. TO REVIEW: unpin once markitdown makes magika optional.
 "markitdown==0.0.2",  # Pinned to 0.0.2 to avoid magika/TensorFlow dependency (introduced in 0.1.0)
 "pandas",
 # //// Neoffice - lmstudio SDK (7cdc45189, 2025-08-22 "Feat add SDK LM Studio"): raven/ai/lmstudio/ talks to a local
 # //// LM Studio server. Upstream only supports OpenAI.
 "google-cloud-documentai",
 "lmstudio>=1.4.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<=17.0.0-dev"

[tool.bench.assets]
build_dir = "./apps/web"
out_dir = "../../raven/public/raven"
index_html_path = "../../raven/www/raven.html"

[project.urls]
Homepage = "https://frappe.io/products/raven"
Repository = "https://github.com/frappe/raven.git"
"Bug Reports" = "https://github.com/frappe/raven/issues"
